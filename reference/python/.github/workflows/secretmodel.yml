name: SecretModel - Spec Verified

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-secretmodel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt || pip install fastapi uvicorn numpy pydantic scikit-learn
      - run: python tests/agent_verifier.py
      - name: Check Privacy Invariants
        run: |
          ! grep -r "card_number" app/ server/ --include="*.py" || exit 1
          grep -r "require_mtls_client" app/ --include="*.py" || exit 1
          echo "SecretModel privacy invariants PASS"